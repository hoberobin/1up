# XcodeGen project for the 1UP.app target. `xcodegen` writes 1UP.xcodeproj (ignored by git).
# tools/make-app.sh builds the same app with SwiftPM alone.
name: 1UP
options:
  bundleIdPrefix: com.masterytrack
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  OneUpCore:
    path: .
targets:
  1UP:
    type: application
    platform: macOS
    sources:
      - path: Sources/OneUp
        excludes: [Support/Info.plist, Support/1UP.entitlements]
      - path: Resources/Themes
        type: folder
        buildPhase: resources
    dependencies:
      - package: OneUpCore
        product: OneUpCore
    info:
      path: Sources/OneUp/Support/Info.plist
    entitlements:
      path: Sources/OneUp/Support/1UP.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masterytrack.oneup
        PRODUCT_NAME: 1UP
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
