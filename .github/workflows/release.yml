# Release on tag: test, build build/1UP.zip and attach it to a GitHub Release.
# Signing and notarisation (spec milestone M5) slot in before the publish step once a Developer ID exists;
# until then the app is ad-hoc signed and the README explains the one-time Gatekeeper step.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
      - run: tools/make-app.sh --zip
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/1UP.zip --title "1UP $GITHUB_REF_NAME" --generate-notes
