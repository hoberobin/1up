# Release on tag: build, sign, notarise, staple, upload the DMG and update the Sparkle feed.
# Needs repo secrets DEVELOPER_ID_CERT_P12, DEVELOPER_ID_CERT_PASSWORD, NOTARY_KEY_ID, NOTARY_ISSUER_ID,
# NOTARY_KEY_P8 and SPARKLE_ED_KEY. Until the team Developer ID is chosen, the job stops after the build.
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
      - run: tools/make-app.sh
      - name: Sign, notarise, staple, DMG, Sparkle feed
        if: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
        run: echo "signing pipeline lands with the Developer ID (spec: M5)"
      - uses: actions/upload-artifact@v4
        with:
          name: 1UP.app
          path: build/1UP.app
